[env:mega-freertos-5-1]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 9600
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter
build_flags = -DAPP_NAME=9
build_src_filter = -<*> +<main.cpp> +<srvSerialStdio/> +<lab5-1App/> +<ddTempSensor/> +<ddPotentiometer/> +<ddRelay/> +<ddLed/> +<ddMotorDriver/>
lib_deps =
    feilipu/FreeRTOS@^11.1.0-3
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    LiquidCrystal_I2C
    Keypad
    Servo

[env:mega-freertos-5-2]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 9600
monitor_echo = yes
monitor_eol = LF

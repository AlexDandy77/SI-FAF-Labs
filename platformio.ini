build_src_filter = -<*> +<main.cpp> +<srvSerialStdio/> +<lab5-2App/> +<ddTempSensor/> +<ddPotentiometer/> +<ddRelay/> +<ddLed/> +<ddMotorDriver/>
lib_deps =
    feilipu/FreeRTOS@^11.1.0-3
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    LiquidCrystal_I2C
